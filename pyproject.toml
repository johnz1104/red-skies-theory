[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-war-sim"
version = "0.2.0"
description = "A game-theoretic model of the Cold War (1945-1991), built for multi-agent reinforcement learning and counterfactual questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
cold-war-campaign = "cold_war_sim.campaign.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=7.4",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cold_war_sim.campaign" = ["data/*.yaml", "data/events/*.yaml", "data/schema/*.json"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["slow: campaign-level tests (skip with -m 'not slow')"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/cold_war_sim"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
