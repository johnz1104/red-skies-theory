# The assumptions register (user decision 7, 2026-10-14; design of 2026-10-17; generated
# report: docs/ASSUMPTIONS.md; code: campaign/assumptions.py).
#
# Every hand-set number in the campaign data is listed here, by class rule or by entry:
# - its basis: data (a dataset, with the source's own error), literature (a historian's or
#   a study's argument), calibrated (fit to a historical date or rate), or judgment;
# - its kind, which sets the scale its range lives on: magnitude or signed (log scale, sign
#   kept), probability or share (logit), relation (logit of (r + 1) / 2), intercept (a
#   binding's base, additive);
# - a plausible range, or why it is fixed (structural, historical, bound, zero, score,
#   method, code).
#
# Addresses: `<doc>:<path>` for goals, powers, regions, leaders, initial and strategy;
# `dynamics:<key>` for a dynamics.DEFAULTS coefficient; `event:<id>/<path>`; `code:` and
# `engine:` for constants in Python. Paths use "/" (binding terms contain dots); list items
# are numbered from 0.

# The range a number gets when its entry gives none (user decision 2026-10-17: graded by
# basis, on natural scales). factor: magnitudes run from v / factor to v * factor; logit:
# probabilities and shares run over logit(v) +- logit; intercept: a binding's base moves by
# this share of its clamp's width either way.
ranges:
  judgment: {factor: 2.0, logit: 1.0, intercept: 0.25}
  literature: {factor: 1.333, logit: 0.5, intercept: 0.125}
  calibrated: {factor: 1.333, logit: 0.5, intercept: 0.125}
  data: {factor: 1.1, logit: 0.25, intercept: 0.05}

# Class rules, tried in order; the first that matches a number covers it. `match` is a glob
# on the address (`*` within one segment, `**` across segments); `path` is a glob on the
# sibling `path` of an effect or a condition; `linked` and `capped` name the address segment
# (counted from the end) that varies across a set whose total is kept, or whose sum may not
# pass 1.
classes:
  # the crisis generator (generator.yaml, E49)
  - {match: "generator:precedence_quarters", group: structure, fixed: structural, why: "quarters a region's crisis blocks a generated one (decision 21)"}
  - {match: "generator:decades/*", group: structure, fixed: structural, why: "the fit's decade bins"}
  - {match: "generator:targets/**", group: generator, fixed: historical, why: "ICB v16 counts, 1945-91 (the fit's targets)"}
  - {match: "generator:features/*/reference", group: structure, fixed: method, why: "a feature's centring: the rate applies at the reference"}
  - {match: "generator:features/*/*", group: generator, kind: signed, why: "a log-hazard slope on a feature (judgment, literature-signed)"}
  - {match: "generator:templates/*/rate", group: generator, kind: magnitude, why: "a template's base rate per region-quarter (fitted to ICB, or judgment)"}
  - {match: "generator:templates/*/group_factor/*", group: generator, kind: magnitude, why: "a template's rate factor for a region group (fitted)"}
  - {match: "generator:templates/*/decade_factor/*", group: generator, kind: magnitude, why: "a template's rate factor for a decade (fitted)"}
  - {match: "generator:templates/*/config/roles/$*/values/*", group: structure, fixed: method, why: "a generated power role's values are derived from its goals"}
  - {match: "generator:templates/*/config/sponsors/$*/values/*", group: structure, fixed: method, why: "a generated power role's values are derived from its goals"}
  - {match: "generator:templates/*/config/patrons/$*/gain/*", group: structure, fixed: method, why: "derived from the goals"}
  - {match: "generator:templates/*/config/patrons/$*/loss/*", group: structure, fixed: method, why: "derived from the goals"}
  - {match: "generator:templates/*/config/values/**", group: structure, fixed: method, why: "an intervention's power roles' values are derived from their goals"}
  - {match: "generator:templates/*/config/sponsors/*/values/*", group: generator, kind: signed, why: "a generated local side's values (computer-run; generic judgment, as Hanoi's in E47)"}
  - {match: "generator:templates/*/config/roles/*/values/*", group: generator, kind: signed, why: "a generated crisis role's values"}
  - {match: "generator:templates/*/config/sides/*/*_value", group: structure, fixed: method, why: "derived from the goals"}
  - {match: "generator:templates/*/config/**/rungs", group: structure, fixed: structural, why: "an option's escalation rungs"}
  - {match: "generator:templates/*/config/grid/*", group: structure, fixed: structural, why: "the offers that may be made"}
  - {match: "generator:templates/*/config/horizon", group: structure, fixed: structural, why: "the talks' length"}
  - {match: "generator:templates/*/config/max_rounds", group: structure, fixed: structural, why: "the war's length"}
  - {match: "generator:templates/*/config/step", group: structure, fixed: structural, why: "the front's step"}
  - {match: "generator:templates/*/config/victory_threshold", group: structure, fixed: structural, why: "the front's end cells"}
  - {match: "generator:templates/*/config/initial_control", group: structure, fixed: structural, why: "the war's starting line, on the front's grid"}
  - {match: "generator:templates/*/bindings/*/clamp/*", group: structure, fixed: bound, why: "a binding's clamp"}
  - {match: "generator:templates/*/bindings/*/base", group: generator, kind: intercept, why: "a generated binding's intercept"}
  - {match: "generator:templates/*/bindings/*/terms/*", group: generator, kind: signed, why: "a generated binding's slope"}
  - {match: "generator:templates/*/config/**/p_high_resolve", group: generator, kind: probability, why: "nature's prior on a role's resolve (agnostic)"}
  - {match: "generator:templates/*/config/p_strong", group: generator, kind: probability, why: "nature's prior on the movement's strength"}
  - {match: "generator:templates/*/config/report_accuracy", group: generator, kind: probability, why: "the patron's intelligence"}
  - {match: "generator:templates/*/config/clash_risk", group: generator, kind: probability, why: "chance a confrontation turns into a clash"}
  - {match: "generator:templates/*/config/**/discount", group: generator, kind: probability, why: "a side's discount per period"}
  - {match: "generator:templates/*/config/breakdown/*", group: generator, kind: probability, why: "the talks' breakdown hazard"}
  - {match: "generator:templates/*/config/script/*/per_rung", group: generator, kind: probability, why: "accident risk per rung (generic, Q27)"}
  - {match: "generator:templates/*/config/script/*/nuclear_per_rung", group: generator, kind: probability, why: "the nuclear share of an accident per rung (generic, Q27)"}
  - {match: "generator:templates/*/config/clients/*/**", group: generator, kind: signed, why: "a generated client's affinities"}
  - {match: "generator:templates/*/config/patrons/*/offer_*/*", group: generator, kind: magnitude, why: "an offer's cost or value to the client"}
  - {match: "generator:templates/*/additions/**", group: effects, kind: signed, why: "a generated template's documented addition"}
  - {match: "generator:templates/**", group: generator, kind: magnitude, why: "a generic template number (judgment)"}
  # ------------------------------------------------------------- structure, not numbers
  - {match: "event:*/model/tier", group: structure, fixed: structural, why: "review priority (on rails above playable_tier)"}
  - {match: "event:*/decision/tier", group: structure, fixed: structural, why: "review priority"}
  - {match: "event:*/priority", group: structure, fixed: structural, why: "the director's scan order"}
  - {match: "strategy:**", group: structure, fixed: historical, why: "years of the historical strategy rows"}
  - {match: "event:**/quarter_of_year", group: structure, fixed: structural, why: "calendar spacing of repeatable events"}
  - {match: "event:**/quarter_of_year/*", group: structure, fixed: structural, why: "calendar spacing of repeatable events"}
  - {match: "event:**/within_years", group: structure, fixed: structural, why: "a condition's look-back window, in whole years"}
  - {match: "event:**/active_for/quarters", group: structure, fixed: structural, why: "a condition's duration, in whole quarters"}
  - {match: "event:*/model/config/max_rounds", group: structure, fixed: structural, why: "the game's length"}
  - {match: "event:*/model/config/horizon", group: structure, fixed: structural, why: "the game's length"}
  - {match: "event:*/model/config/step", group: structure, fixed: structural, why: "the front's step; with the victory threshold it sets the number of cells"}
  - {match: "event:*/model/config/victory_threshold", group: structure, fixed: structural, why: "the front's end cells"}
  - {match: "event:*/model/config/initial_control", group: structure, fixed: structural, why: "the war's starting line, on the front's grid: with the step and the thresholds it sets the steps to victory (a step-wise kind could draw it later)"}
  - {match: "event:*/model/config/grid/*", group: structure, fixed: structural, why: "the offers that may be made"}
  - {match: "event:*/model/config/offers/grid/*", group: structure, fixed: structural, why: "the offers that may be made"}
  - {match: "event:*/model/config/offers/opens", group: structure, fixed: structural, why: "the round in which talks open"}
  - {match: "event:*/model/config/commitments/*/at_least", group: structure, fixed: structural, why: "a commitment's terms, on the offer grid"}
  - {match: "event:*/model/config/red_lines/*/above", group: structure, fixed: structural, why: "the line a red line names, on the front's grid (Korea: the 38th parallel); drawn off the grid it moves the warning by a cell and the historical choices out of step (E42)"}
  - {match: "event:*/model/config/sides/*/commitment", group: structure, fixed: structural, why: "a commitment's terms, on the offer grid"}
  - {match: "event:*/model/config/contest/initial", group: structure, fixed: structural, why: "the contest starts in the middle"}
  - {match: "event:*/model/config/contest/step", group: structure, fixed: structural, why: "the contest's step (four net gains end it)"}
  - {match: "event:*/model/config/script/*/options/*/rungs", group: structure, fixed: structural, why: "an option's escalation rungs"}
  - {match: "event:*/model/bindings/*/clamp/*", group: structure, fixed: bound, why: "a binding's clamp bounds the bound value's plausible range"}
  - {match: "event:*/model/results/**", group: structure, fixed: method, why: "standing-scoreboard results, never in a reward"}
  - {match: "goals:standing/**", group: structure, fixed: method, why: "the standing scoreboard, never in a reward"}
  - {match: "goals:lookahead/quarters", group: structure, fixed: structural, why: "derived payoffs' horizon in whole quarters (the planners' horizon, E25)"}

  # ------------------------------------------------- the pre-goals score only (E11, E33)
  - {match: "powers:powers/*/score_weights/*", group: score, fixed: score, why: "only reward=\"score\" reads it"}
  - {match: "powers:powers/*/end_bonus/*", group: score, fixed: score, why: "end bonuses apply only to reward=\"score\" (E33)"}
  - {match: "powers:rewards/elimination_penalty", group: score, fixed: score, why: "only reward=\"score\" reads it"}
  - {match: "powers:powers/*/initial/prestige", group: score, fixed: score, why: "prestige left the goals (2026-10-10); only the pre-goals score reads it"}
  - {match: "event:**/effects/**/value", path: "*.prestige", group: score, fixed: score, why: "prestige left the goals; only the pre-goals score reads it"}

  # ------------------------------------------------------------------- goals (goals.yaml)
  - {match: "goals:weights/*/*/weights/*", group: goals, kind: share, linked: -1, why: "a goal weight row sums to 1"}
  - {match: "goals:components/influence/interest/*/*", group: goals, kind: magnitude, why: "an interest-map multiplier"}
  - {match: "goals:components/influence/rivalry/*", group: goals, kind: magnitude, why: "rivalry intensity lambda"}
  - {match: "goals:components/allies/**", group: goals, kind: magnitude, why: "the allies band (GOALS.md section 14; placeholders)"}
  - {match: "goals:**", group: goals, kind: magnitude, why: "a goal-function constant"}

  # --------------------------------------------- powers, regions, leaders, the opening state
  - {match: "powers:postures/*/*", group: postures, kind: share, linked: -1, why: "a posture's budget shares sum to 1"}
  - {match: "powers:powers/*/tech_rates/*", group: powers, kind: magnitude, basis: calibrated, why: "technology rates, fit to milestone dates (E10, E35)"}
  - {match: "powers:powers/*/initial/growth", group: powers, kind: signed, why: "opening trend growth"}
  - {match: "powers:powers/*/initial/stability", group: powers, kind: share, why: "opening domestic stability"}
  - {match: "powers:powers/*/initial/burden", group: powers, kind: share, why: "opening military burden (share of GDP)"}
  - {match: "powers:powers/*/initial/*", group: powers, kind: magnitude, why: "an opening stock (economy index, forces, technology, credibility)"}
  - {match: "powers:powers/*/military_efficiency", group: powers, kind: magnitude, why: "conversion of budget into forces"}
  - {match: "powers:powers/*/casualty_sensitivity", group: powers, kind: magnitude, why: "how much the domestic cost of casualties weighs on a power (democracy 1)"}
  - {match: "powers:relations/*", group: relations, kind: relation, why: "an opening relation"}
  - {match: "powers:rewards/*", group: goals, kind: magnitude, why: "a terminal term of the goal reward"}
  - {match: "regions:regions/*/influence/*", group: regions, kind: share, capped: -1, why: "a 1945 influence share; a region's shares may not pass 1"}
  - {match: "regions:regions/*/importance", group: regions, kind: magnitude, why: "a region's weight in influence scores"}
  - {match: "regions:regions/*/*", group: regions, kind: share, why: "opening or base stability"}
  - {match: "leaders:leaders/*/*", group: leaders, kind: share, why: "a leader trait in [0, 1]"}
  - {match: "initial:tension", group: powers, kind: share, why: "opening tension"}
  - {match: "dynamics:*", group: dynamics, kind: magnitude, why: "a dynamics coefficient (see the entries)"}

  # --------------------------------------------------------------------- events: firing
  - {match: "event:*/hazard", group: hazards, kind: probability, why: "chance per quarter that an event fires while it can"}
  - {match: "event:*/when/**/compare/scale", group: conditions, kind: magnitude, why: "a condition's ratio between two world values"}
  - {match: "event:*/when/**/compare/value", path: "powers.*.tech_*", group: structure, fixed: structural, why: "a technology milestone's threshold (1.0 a first capability, 2.0 a second): the calibrated technology rates carry the timing's uncertainty"}
  - {match: "event:*/when/**/compare/value", group: conditions, kind: auto, why: "a condition's threshold (its kind follows the compared path)"}

  # -------------------------------------------------------------------- events: effects
  - {match: "event:**/effects/**/set/value", group: effects, kind: auto, why: "an effect that sets a world value"}
  - {match: "event:**/effects/**/add/value", group: effects, kind: signed, why: "an effect's change to a world value"}
  - {match: "event:**/effects/**/relations/add", group: effects, kind: signed, why: "an effect's change to a relation"}
  - {match: "event:**/effects/**/shift_influence/amount", group: effects, kind: signed, why: "an effect's influence shift"}
  - {match: "event:**/effects/**/tension", group: effects, kind: signed, why: "an effect's change to tension"}
  - {match: "event:**/effects/**/lottery/chance", group: effects, kind: probability, why: "a lottery's odds"}
  # outcomes under the shared effects contract list only documented additions (E47)
  - {match: "event:**/additions/**/set/value", group: effects, kind: auto, why: "a documented addition that sets a world value"}
  - {match: "event:**/additions/**/add/value", group: effects, kind: signed, why: "a documented addition's change to a world value"}
  - {match: "event:**/additions/**/relations/add", group: effects, kind: signed, why: "a documented addition's change to a relation"}
  - {match: "event:**/additions/**/shift_influence/amount", group: effects, kind: signed, why: "a documented addition's influence shift"}
  - {match: "event:**/additions/**/tension", group: effects, kind: signed, why: "a documented addition's change to tension"}
  - {match: "event:**/additions/**/multiply/factor", group: effects, kind: magnitude, why: "a documented addition's scaling of a world value"}

  # ------------------------------------- the shared effects contract (contract.yaml, E47)
  - {match: "contract:reference_importance", group: contract, kind: magnitude, why: "the region importance at which the contract's influence shifts apply in full (about the mean, 1.43)"}
  - {match: "contract:*/*/influence", group: contract, kind: share, why: "influence moved to the winners in the event's region (crises 0.05-0.25, wars 0.15-0.5 in the reviewed events)"}
  - {match: "contract:*/*/winner_credibility", group: contract, kind: magnitude, why: "the winners' credibility gain"}
  - {match: "contract:*/*/loser_credibility", group: contract, kind: signed, why: "the losers' credibility loss"}
  - {match: "contract:*/*/tension", group: contract, kind: signed, why: "an outcome's change to tension (a compromise or agreement eases it, a war or breakdown raises it)"}
  - {match: "contract:*/*/quarters", group: contract, kind: magnitude, why: "an unplayed war costs this many quarters of full effort (decision 6: about a year)"}
  - {match: "contract:*/*/forces", group: contract, kind: share, why: "the share of conventional forces an unplayed war destroys (the dynamics drain none)"}
  - {match: "contract:*/*/region_stability", group: contract, kind: signed, why: "an outcome's damage to the region's stability"}
  - {match: "contract:*/*/relations", group: contract, kind: signed, why: "an outcome's change to the two sides' relations"}

  # ------------------------------------------------------------------- events: bindings
  - {match: "event:*/model/bindings/*/base", group: bindings, kind: intercept, why: "a binding's intercept (moves by a share of its clamp's width)"}
  - {match: "event:*/model/bindings/*/terms/*", group: bindings, kind: signed, why: "a binding's slope on a world value"}

  # ---------------------------------------- events: hidden types and beliefs (all families)
  - {match: "event:*/model/config/types/*/levels/*/weight", group: types, kind: probability, linked: -2, why: "a type's prior (nature's odds)"}
  - {match: "event:*/model/config/types/*/levels/*/belief", group: types, kind: probability, linked: -2, why: "the other side's prior about a type"}
  - {match: "event:*/model/config/types/*/levels/*/own_belief", group: types, kind: probability, linked: -2, why: "the holder's own prior about an unseen type"}
  - {match: "event:*/model/config/types/*/levels/*/*", group: types, kind: magnitude, why: "a type level's strength, cost or proxy multiplier"}
  - {match: "event:*/model/config/types/*/prior/*", group: types, kind: probability, linked: -1, why: "a bargaining type's prior"}
  - {match: "event:*/model/config/types/*/delay_cost/*", group: types, kind: magnitude, why: "a bargaining type's per-period cost"}
  - {match: "event:*/model/config/script/*/temperaments/*/weight", group: types, kind: probability, linked: -2, why: "an officer's temperament (nature's odds; E48)"}
  - {match: "event:*/model/config/script/*/temperaments/*/hold_cost", group: structure, fixed: structural, why: "which temperament fires: a steady officer's hold costs less than its loss from war, a by-the-book one's more (E48)"}
  - {match: "event:*/model/config/script/*/temperaments/*/fire_cost", group: structure, fixed: structural, why: "which temperament fires: a steady officer believes the alarm false, so firing costs it more than holding (E48)"}
  - {match: "event:*/model/config/script/*/options/*/control", group: incidents, kind: share, why: "the share of a side's officers' hold cost a control order lifts (E48)"}
  - {match: "event:*/model/config/script/*/fire/hold_cost", group: incidents, kind: magnitude, why: "a leader's cost of waiting after an officer fires: its belief the threat is real times the loss (E48)"}
  - {match: "event:*/model/config/script/*/roles/*/stakes/*/weight", group: types, kind: probability, linked: -2, why: "a stakes type's prior"}
  - {match: "event:*/model/config/script/*/roles/*/stakes/*/offsets/*", group: types, kind: signed, why: "a stakes type's offset to the holder's values"}
  - {match: "event:*/model/config/script/*/roles/*/stakes_beliefs/*/*", group: types, kind: probability, linked: -1, why: "a role's belief about another's stakes"}
  - {match: "event:*/model/config/script/*/roles/*/resolve_beliefs/*", group: types, kind: probability, why: "a role's belief about another's resolve"}
  - {match: "event:*/model/config/script/*/roles/*/p_*", group: types, kind: probability, why: "a crisis type's prior"}

  # ---------------------------------------------------------- events: crisis scripts
  - {match: "event:*/model/config/script/*/accuracy", group: config, kind: probability, why: "an intelligence stage's accuracy"}
  - {match: "event:*/model/config/script/*/base", group: config, kind: probability, why: "an accident stage's base chance"}
  - {match: "event:*/model/config/script/*/per_rung", group: config, kind: probability, why: "an accident stage's chance per rung"}
  - {match: "event:*/model/config/script/*/nuclear_per_rung", group: config, kind: probability, why: "an accident's nuclear share per rung"}
  - {match: "event:*/model/config/script/*/cap", group: config, kind: probability, why: "an accident stage's cap"}
  - {match: "event:*/model/config/script/**", group: config, kind: magnitude, why: "an option's cost or multiplier"}

  # ------------------------------------------------- events: family configs (payoffs, costs)
  - {match: "event:*/model/config/**/values/*", group: payoffs, kind: signed, why: "a hand-set payoff (dead where derived payoffs replace it)"}
  - {match: "event:*/model/config/values/*/*", group: payoffs, kind: signed, why: "a hand-set payoff (dead where derived payoffs replace it)"}
  - {match: "event:*/model/config/sponsors/*/settlement/*", group: payoffs, kind: signed, why: "a settlement's value (dead where derived)"}
  - {match: "event:*/model/config/sides/*/breakdown_value", group: payoffs, kind: signed, why: "a hand-set payoff (dead where derived)"}
  - {match: "event:*/model/config/sides/*/impasse_value", group: payoffs, kind: signed, why: "a hand-set payoff (dead where derived)"}
  - {match: "event:*/model/config/consent/*/base", group: payoffs, kind: signed, why: "a consent role's value (dead where derived)"}
  - {match: "event:*/model/config/consent/*/per_share", group: payoffs, kind: signed, why: "a consent role's value per share (dead where derived)"}
  - {match: "event:*/model/config/consent/*/veto_value", group: payoffs, kind: signed, why: "a consent role's veto value (dead where derived)"}
  - {match: "event:*/model/config/clients/*/affinity/*", group: payoffs, kind: signed, why: "a client's pull toward a patron (dead where derived)"}
  - {match: "event:*/model/config/clients/*/nonaligned", group: payoffs, kind: signed, why: "a client's pull toward non-alignment (dead where derived)"}
  - {match: "event:*/model/config/patrons/*/gain/*", group: payoffs, kind: signed, why: "a patron's gain from a client (dead where derived)"}
  - {match: "event:*/model/config/patrons/*/loss/*", group: payoffs, kind: signed, why: "a patron's loss from a client (dead where derived)"}
  - {match: "event:*/model/config/surplus", group: payoffs, kind: magnitude, why: "the value at stake in a bargain"}
  - {match: "event:*/model/config/sides/*/discount", group: config, kind: probability, why: "a side's per-period discount"}
  - {match: "event:*/model/config/breakdown/*", group: config, kind: probability, why: "talks' breakdown risk"}
  - {match: "event:*/model/config/contest/win_probability", group: config, kind: probability, why: "the contest's odds per period"}
  - {match: "event:*/model/config/p_strong", group: config, kind: probability, why: "an uprising's chance of strength"}
  - {match: "event:*/model/config/report_accuracy", group: config, kind: probability, why: "intelligence accuracy"}
  - {match: "event:*/model/config/clash_risk", group: config, kind: probability, why: "chance a confrontation becomes a clash"}
  - {match: "event:*/model/config/quagmire_prob", group: config, kind: probability, why: "chance an intervention becomes a quagmire"}
  - {match: "event:*/model/config/deployment/*", group: config, kind: share, why: "the share of strength in place in the first quarter"}
  - {match: "event:*/model/identities/*/stalemate_share", group: config, kind: share, why: "the share an identity role governs after a stalemate"}
  - {match: "event:*/model/config/clients/*/temperature", group: config, kind: magnitude, why: "a computer-run client's logit temperature"}
  - {match: "event:*/model/config/**", group: config, kind: magnitude, why: "a cost, capacity, strength or rate"}

# Entries: single numbers with what is known about them. `value` is a check (the loader
# fails if the data holds another value). An entry's basis, kind, range (absolute),
# factor or logit override its class rule; `sample: false` lists a range but never draws.
entries:
  # ---------------------------------------------------------------- goals (goals.yaml)
  "goals:kappa":
    value: 100.0
    range: [50.0, 200.0]
    placeholder: true
    source: "GOALS.md section 7; its default is deferred to the sweep (section 12)"
    note: "converts goal-score units into sub-game payoff units for derived payoffs; family costs (effort, signals, escalation) are in sub-game units, so kappa sets their weight against outcomes"
  "goals:lookahead/discount":
    value: 0.97
    kind: probability
    range: [0.94, 0.99]
    placeholder: true
    source: "E25"
    note: "per quarter (about 11% a year): the discount on follow-on cutscenes in derived payoffs"
  "goals:components/economy/scale":
    value: 4.0
    note: "the economy component reaches 1 after GDP quadruples from 1945; a normalization that sets the economy's weight against the other components"
  "goals:components/security/nuclear/weight":
    value: 0.6
    source: "GOALS.md section 4"
    note: "nuclear forces' weight in military strength (the linear model; the saturating Weibull curve stays off until data grounding)"
  "goals:components/security/buffer/weight":
    value: 0.25
    placeholder: true
    source: "GOALS.md section 16 (decision 9, 2026-10-11; E23)"
    note: "holding every buffer region adds this to security, as much as moving the military balance from 0.50 to 0.75"
  "goals:components/allies/height":
    value: 0.5
    placeholder: true
    source: "GOALS.md section 14 (E16)"
    note: "an ally's value inside its band"
  "goals:components/allies/cost":
    value: 0.5
    placeholder: true
    source: "GOALS.md section 14"
