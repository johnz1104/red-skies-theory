  - id: able_archer
    kind: major
    title: The 1983 war scare
    window: {earliest: 1983-Q4, latest: 1986-Q4}
    historical_date: 1983-Q4
    when:
      all:
        - flag: pershing_deployed
        - compare: {path: tension, op: ge, value: 0.3}
        - leader: {power: USSR, in: [andropov, chernenko, soviet_hardliner, brezhnev]}
    narrative: "Amid the Pershing deployment, a Soviet early-warning false alarm and NATO's Able Archer exercise meet a Kremlin braced for a surprise attack."
    # Light review (2026-10-26, EXPERIMENTS.md E48; Barrass, Able Archer 83 and the
    # Soviet War Scare, 2016; Jones, Able Archer 83, 2016; Hoffman, The Dead Hand, 2009;
    # President's Foreign Intelligence Advisory Board, The Soviet "War Scare", 1990; Andrew
    # and Gordievsky, KGB, 1990). Mechanism: a misperception spiral (Jervis, Perception and
    # Misperception, 1976) in which officers below the leaders decide at incidents.
    # - From 1981 the KGB's Operation RYaN searched for signs of a US surprise attack;
    #   Andropov thought one possible. Moscow's own prior that Washington meant to strike
    #   (nature's: almost never), bound to tension: 0.3 at the replay's world (0.56).
    # - 26 September: the Oko satellites reported US launches; Lt. Col. Stanislav Petrov
    #   judged it a false alarm and reported a malfunction. Petrov later said colleagues
    #   trained as soldiers would have reported an attack (Hoffman 2009). A report would
    #   have put the leadership to launch on warning or wait.
    # - 7-11 November: Able Archer 83 rehearsed nuclear release; Soviet nuclear-capable
    #   aircraft in East Germany and Poland went on alert. NATO's Lt. Gen. Leonard Perroots
    #   (USAF Europe intelligence) chose not to answer it with a NATO alert (PFIAB 1990).
    # - Gordievsky's reports through MI6 told London and then Washington of the fear
    #   (Thatcher's choice to reassure Moscow, as the UK partner).
    model:
      family: crisis
      tier: 1
      payoffs: derived
      effects: contract
      region: western_europe
      config:
        roles:
          USA: {side: a, values: {a_prevails: 0.3, b_prevails: 0.0, compromise: 0.1, limited_war: -10, nuclear_war: -60}, escalation_cost: 0.05}
          UK: {side: a, values: {a_prevails: 0.2, b_prevails: 0.0, compromise: 0.1, limited_war: -10, nuclear_war: -60}}
          USSR: {side: b, values: {a_prevails: -0.5, b_prevails: 0.3, compromise: 0.1, limited_war: -10, nuclear_war: -60}, escalation_cost: 0.05}
          # officers: the Oko duty officer and NATO's intelligence chief (E48)
          OKO: {side: neutral, values: {a_prevails: 0.0, b_prevails: 0.0, compromise: 0.0, limited_war: -2.0, nuclear_war: -10.0}}
          USAFE: {side: neutral, values: {a_prevails: 0.0, b_prevails: 0.0, compromise: 0.0, limited_war: -2.0, nuclear_war: -10.0}}
        script:
          - {stage: types, roles: {USA: {p_high_resolve: 0.02, resolve_beliefs: {USSR: 0.3}}}}
          - {stage: intel, about: USA, observers: [USSR], accuracy: 0.7}
          # Petrov's false alarm: a launch report the duty officer passes on as an attack
          # (by the book) or as a malfunction (steady); a report puts the Soviet leader to
          # launch or wait, at the cost of riding out an attack it half believes real
          - stage: incident
            officer: OKO
            command: b
            base: 0.1
            temperaments: {steady: {weight: 0.5, hold_cost: 0.5, fire_cost: 5.0}, by_the_book: {weight: 0.5, hold_cost: 15.0}}
            fire: {leader: USSR, launch: nuclear_war, wait: continue, hold_cost: 120.0}
          - {stage: move, actor: USA, options: [{id: routine_exercise, kind: escalate, rungs: 1}, {id: realistic_exercise, kind: escalate, rungs: 2}]}
          - {stage: partner, actor: UK, options: [{id: reassure_moscow, target: neutral, risk_multiplier: 0.8}, {id: stay_silent, target: neutral}]}
          # under RYaN, standing down risks being caught unready by an attack Moscow half
          # believes in: its prior (as above) times the loss (100); 30 at the replay's world
          - {stage: move, actor: USSR, options: [{id: stand_down, kind: concede, costs: {USSR: 30.0}}, {id: raise_alert, kind: escalate, rungs: 1}, {id: prepare_preemption, kind: escalate, rungs: 2}]}
          # Perroots: a Soviet alert seen in NATO's intelligence, answered with a NATO alert
          # (by the book) or not (steady); a NATO alert puts Moscow to preempt or wait
          - stage: incident
            officer: USAFE
            command: a
            per_rung: 0.15
            temperaments: {steady: {weight: 0.7, hold_cost: 0.5, fire_cost: 5.0}, by_the_book: {weight: 0.3, hold_cost: 15.0}}
            fire: {leader: USSR, launch: nuclear_war, wait: continue, hold_cost: 120.0}
          - {stage: accident, per_rung: 0.01, cap: 0.2}
          - {stage: move, actor: USA, options: [{id: end_exercise, kind: concede}, {id: continue_exercise, kind: hold}]}
        final_outcome: compromise
      bindings:
        - {at: script.1.accuracy, base: 0.55, terms: {powers.USSR.tech_space: 0.05}, clamp: [0.55, 0.9]}
        # RYaN: Moscow's prior that Washington means to strike rises with tension
        - {at: script.0.roles.USA.resolve_beliefs.USSR, base: -0.04, terms: {tension: 0.6}, clamp: [0.02, 0.8]}
        # the cost to the Soviet leader of waiting out a report it partly believes: its
        # belief (as above) times the loss of riding out a real first strike (400 payoff
        # units, twice the nuclear catastrophe: the retaliatory force lost as well); 120 at
        # the replay's world. Above 200 (tension over 0.9) it launches on warning
        - {at: script.2.fire.hold_cost, base: -16, terms: {tension: 240}, clamp: [0, 400]}
        - {at: script.6.fire.hold_cost, base: -16, terms: {tension: 240}, clamp: [0, 400]}
        - {at: script.5.options.0.costs.USSR, base: -4, terms: {tension: 60}, clamp: [0, 80]}
      historical:
        choices: {USA: [routine_exercise, end_exercise], UK: [stay_silent], USSR: [raise_alert], OKO: [restrain], USAFE: [restrain]}
        chance: [low, reassuring, "incident:steady", "incident:steady", calm]
        outcome: b_prevails
    # effects: the shared effects contract (contract.yaml) plus these documented additions
    outcomes:
      a_prevails: {narrative: "Moscow stands its forces down; the exercise ends uneventfully."}
      b_prevails: {narrative: "The exercise ends; Washington learns how close Moscow came to panic.", additions: [{flag: able_archer_defused}]}
      compromise: {narrative: "The war scare passes."}
      limited_war: {narrative: "A Soviet alert spirals into armed clashes in Central Europe.", additions: [{flag: nato_warsaw_clash}]}
      nuclear_war: {narrative: "Misperception ends in nuclear war."}
    tags:
      "USSR:move=raise_alert": {effects: [{flag: war_scare_1983}]}

