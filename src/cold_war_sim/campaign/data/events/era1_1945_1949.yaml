  - id: marshall_plan
    kind: major
    title: The Marshall Plan
    window: {earliest: 1947-Q2, latest: 1948-Q2}
    historical_date: 1947-Q2
    when: {compare: {path: regions.western_europe.stability, op: lt, value: 0.65}}
    narrative: Secretary Marshall offers American aid for European recovery.
    # Reviewed 2026-10-10 (EXPERIMENTS.md E19); clients split 2026-10-11 (E21). Aid's effects in
    # the world scale with the US offer level (metric commit:USA: none 0, aid 0.5, aid_guarantee
    # 1): recipients' growth and stability. The plan (~$13.3B in 1948-51, about 5% of one year's
    # US GDP) was a one-off transfer of wealth, not a permanent cut in output, so it is not an
    # economy-level effect. Its cost to the US lives in the offer cost until the game has a
    # stock of wealth or debt (GOALS.md section 15).
    model:
      family: alignment
      tier: 1
      payoffs: derived
      region: western_europe
      config:
        patrons:
          # Offer values and costs stay game parameters (derived payoffs value choices, not
          # offers). They match the same anchors at kappa 100: the full plan costs the US about
          # 0.55 in goal units (paid per aligned client), and is worth about 1.2 to Britain or France.
          # Gains and losses below are hand-set fallbacks; derived payoffs replace them.
          USA:
            offer_value: {none: 0.0, aid: 0.8, aid_guarantee: 1.2}
            offer_cost: {none: 0.0, aid: 0.15, aid_guarantee: 0.3}
            gain: {UK: 1.0, FRA: 1.5, ITA: 1.0, WSMALL: 0.8, CZE: 0.5, EAST: 1.0}
            loss: {ITA: 0.5, WSMALL: 0.3, CZE: 0.2, EAST: 0.3}
          USSR:
            offer_value: {none: 0.0, aid: 0.3, aid_guarantee: 0.6}
            offer_cost: {none: 0.0, aid: 0.1, aid_guarantee: 0.2}
            gain: {EAST: 1.5, CZE: 0.6, FRA: 0.8, ITA: 1.0, WSMALL: 0.5}
            loss: {UK: 0.2, FRA: 0.6, ITA: 0.5, WSMALL: 0.3, CZE: 0.5, EAST: 1.0}
            # Stalin can forbid the countries he controls to take American aid (as on
            # 9 July 1947). A client that defies the order loses this from aligning with the US.
            # The East (Soviet troops): 2.0, more than the full US offer (1.2), so defiance is
            # about 1 in 100. Czechoslovakia: 1.2 (user decision 2026-10-11), because Prague had
            # no Soviet troops and Yugoslavia defied Stalin a year later: about 1 in 7 defies when
            # the US offers aid. The cost of forbidding is derived from the "USSR:forbade" tag
            # and its follow-ons (Eastern stagnation); 0.1 is the fallback.
            control: {CZE: 1.2, EAST: 2.0}
            forbid_cost: 0.1
        # Computer-run clients choose by a logit over pull + offer value (temperature 0.4).
        # Pulls are anchored on 1945-47 elections (Nohlen and Stover, Elections in Europe, 2010):
        # with no offers, a client's odds of US : USSR : non-aligned match its vote for
        # pro-Western : communist-led : other parties, so pull = 0.2 + 0.4 ln(share / non-aligned
        # share) with non-aligned at 0.2. Soviet troops and police add a coercion term.
        clients:
          UK: {mode: player, affinity: {USA: 0.6, USSR: -0.8}, nonaligned: 0.3}
          FRA: {mode: player, affinity: {USA: 0.4, USSR: -0.2}, nonaligned: 0.4}
          # Italy, 1946: anti-communist parties 54.5%, Popular Front (PCI + PSIUP) 39.6%, other
          # 5.9%. The real swing. Its tilt follows Mediterranean stability (its region), +-1 per
          # unit around the 1947 value (0.473).
          ITA: {mode: chance, affinity: {USA: 1.09, USSR: 0.96}, nonaligned: 0.2, temperature: 0.4}
          # Benelux, Scandinavia, Austria, 1944-46: communists 10.4% (population-weighted),
          # neutral Sweden 16%, the rest 73.6%. Tilt follows Western European stability.
          WSMALL: {mode: chance, affinity: {USA: 0.81, USSR: 0.03}, nonaligned: 0.2, temperature: 0.4}
          # Czechoslovakia, 1946: communists 38%, democratic parties 48%, Social Democrats and
          # others 14%; no Soviet troops since December 1945; the cabinet accepted the invitation
          # unanimously on 7 July 1947. Soviet coercion adds 0.6 x Soviet influence in Eastern
          # Europe (half the slope of the Soviet-held East: no troops).
          CZE: {mode: chance, affinity: {USA: 0.69, USSR: 0.94}, nonaligned: 0.2, temperature: 0.4}
          # Poland, Hungary, Romania, Bulgaria: Soviet troops and communist-run police; the choice
          # was Stalin's. Pull = 2.0 x Soviet influence in Eastern Europe (coercion), US 0.1.
          EAST: {mode: chance, affinity: {USA: 0.1, USSR: 1.14}, nonaligned: 0.0, temperature: 0.4}
      bindings:
        - {at: clients.ITA.affinity.USA, base: 0.617, terms: {regions.mediterranean.stability: 1.0}, clamp: [-1.0, 2.0]}
        - {at: clients.ITA.affinity.USSR, base: 1.435, terms: {regions.mediterranean.stability: -1.0}, clamp: [-1.0, 2.0]}
        - {at: clients.WSMALL.affinity.USA, base: 0.301, terms: {regions.western_europe.stability: 1.0}, clamp: [-1.0, 2.0]}
        - {at: clients.WSMALL.affinity.USSR, base: 0.537, terms: {regions.western_europe.stability: -1.0}, clamp: [-1.0, 2.0]}
        - {at: clients.CZE.affinity.USSR, base: 0.599, terms: {regions.eastern_europe.influence.USSR: 0.6}, clamp: [-1.0, 2.0]}
        - {at: clients.EAST.affinity.USSR, base: 0.0, terms: {regions.eastern_europe.influence.USSR: 2.0}, clamp: [-1.0, 2.0]}
      historical:
        choices: {USA: [aid_guarantee], USSR: [aid_guarantee, forbid], UK: [aligned_USA], FRA: [aligned_USA]}
        chance: [aligned_USA, aligned_USA, aligned_USSR, aligned_USSR]
        outcome: aligned_USA
    outcomes:
      aligned_USA:
        narrative: Western Europe accepts Marshall aid; recovery begins.
        effects:
          - flag: marshall_plan_accepted
          - shift_influence: {region: western_europe, toward: USA, amount: 0.1}
          # the western zones of Germany took part through the occupying powers
          - shift_influence: {region: germany, toward: USA, amount: 0.05}
          - add: {path: powers.UK.growth, value: 0.005, scale_by: "commit:USA"}
          - add: {path: regions.western_europe.stability, value: 0.15, scale_by: "commit:USA"}
      # Switching blocs costs relations with the US like the Berlin clash between the
      # superpowers (-0.4); staying out of both costs what a veto does in Berlin (-0.1).
      # Without these, Britain's derived pull toward the US was only +0.24 and a Soviet aid
      # offer (0.3) could outweigh it (EXPERIMENTS.md E24).
      aligned_USSR:
        narrative: Britain turns away from American aid and toward Moscow.
        effects:
          - shift_influence: {region: western_europe, toward: USSR, amount: 0.05}
          - relations: {a: UK, b: USA, add: -0.4}
          - relations: {a: UK, b: USSR, add: 0.2}
      nonaligned:
        narrative: Britain keeps its distance from both blocs.
        effects:
          - add: {path: regions.western_europe.stability, value: -0.05}
          - relations: {a: UK, b: USA, add: -0.1}
    tags:
      "FRA:aligned_USA":
        effects:
          - flag: france_in_marshall_plan
          - shift_influence: {region: western_europe, toward: USA, amount: 0.05}
          - add: {path: powers.FRA.growth, value: 0.005, scale_by: "commit:USA"}
          - add: {path: powers.FRA.stability, value: 0.05, scale_by: "commit:USA"}
      "FRA:aligned_USSR":
        effects:
          - flag: france_neutralist
          - shift_influence: {region: western_europe, toward: USSR, amount: 0.1}
          - relations: {a: FRA, b: USA, add: -0.4}
          - relations: {a: FRA, b: USSR, add: 0.2}
      "FRA:nonaligned": {effects: [{relations: {a: FRA, b: USA, add: -0.1}}]}
      # Each client moves its share of what the old single clients moved, by Marshall aid share
      # (Italy 11.4%, Benelux 12.5%, Austria 5.0%, Scandinavia 4.8%; 1948-52) or, in the East,
      # by population (Czechoslovakia about 18% of the region).
      "ITA:aligned_USA":
        effects:
          - flag: italy_in_marshall_plan
          - shift_influence: {region: mediterranean, toward: USA, amount: 0.1}
          - add: {path: regions.mediterranean.stability, value: 0.05, scale_by: "commit:USA"}
      "ITA:aligned_USSR":
        effects:
          - flag: italy_popular_front
          - shift_influence: {region: mediterranean, toward: USSR, amount: 0.15}
          - add: {path: regions.mediterranean.stability, value: -0.05}
      "WSMALL:aligned_USA":
        effects:
          - flag: western_europe_in_marshall_plan
          - shift_influence: {region: western_europe, toward: USA, amount: 0.06}
          - add: {path: regions.western_europe.stability, value: 0.05, scale_by: "commit:USA"}
      "WSMALL:aligned_USSR":
        effects:
          - flag: western_europe_communist_surge
          - shift_influence: {region: western_europe, toward: USSR, amount: 0.1}
          - add: {path: regions.western_europe.stability, value: -0.05}
      "CZE:aligned_USA": {effects: [{flag: eastern_marshall}, {shift_influence: {region: eastern_europe, toward: USA, amount: 0.03}}]}
      "CZE:aligned_USSR": {effects: [{shift_influence: {region: eastern_europe, toward: USSR, amount: 0.02}}]}
      "EAST:aligned_USA": {effects: [{flag: eastern_marshall}, {shift_influence: {region: eastern_europe, toward: USA, amount: 0.12}}]}
      "EAST:aligned_USSR": {effects: [{flag: molotov_plan}, {shift_influence: {region: eastern_europe, toward: USSR, amount: 0.08}}]}
      # Forbidding: the East forgoes Western aid (slower recovery, resentment). The order was
      # private (Prague and Warsaw were told in Moscow), so it carries no US-relations cost of
      # its own: the public break is in the Czechoslovak coup and the Cominform, which have
      # their own effects (user decision 2026-10-11; EXPERIMENTS.md E23).
      "USSR:forbade":
        effects:
          - flag: eastern_participation_forbidden
          - add: {path: regions.eastern_europe.stability, value: -0.05}
          - tension: 0.02

