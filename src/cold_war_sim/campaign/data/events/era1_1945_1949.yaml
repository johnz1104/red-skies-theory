      a_withdrew: {narrative: "France abandons Indochina.", effects: [{shift_influence: {region: indochina, toward: PRC, amount: 0.3}}, {flag: [vietnam_unified_communist, french_exit_indochina]}, {add: {path: powers.FRA.prestige, value: -0.1}}]}
