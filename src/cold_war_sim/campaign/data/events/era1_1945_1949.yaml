  - id: berlin_blockade
    kind: major
    title: The Berlin Blockade
    window: {earliest: 1948-Q1, latest: 1949-Q4}
    historical_date: 1948-Q2
    when:
      all:
        - flag: [western_zones_merged, berlin_four_power]
    narrative: The Soviet Union blockades the western sectors of Berlin; the airlift begins.
    # Reviewed 2026-10-11 (EXPERIMENTS.md E20-E21). A hold-out: reviewed, never tuned to history.
    # Bargaining while fighting, with hidden resolve on both sides. Each quarter the West names
    # terms (share = the West's share: 1 keeps Berlin and the West German programme) and the
    # USSR keeps the blockade or lifts it on them: the West bargains, the USSR endures. Between
    # quarters the airlift and the blockade contest the city's supply. The contest is public
    # (tonnage was reported daily) but random: nobody knew whether the airlift would last the
    # winter. Each side's per-quarter cost of carrying on is private: the West's airlift cost and
    # political risk (the November 1948 election, British austerity); Stalin's cost of the
    # blockade and of the Western counter-blockade. The West did not know Stalin's aims or
    # resolve (Shlaim 1983; Harrington 2012); Stalin expected the West to give way (Narinsky 1996).
    model:
      family: bargaining
      tier: 1
      holdout: true
      payoffs: derived
      cadence: quarterly
      region: germany
      config:
        roles: {A: USA, B: USSR}
        grid: [0.0, 0.25, 0.5, 0.75, 1.0]
        horizon: 5
        proposers: A
        surplus: 2.0
        # Outcome values below are hand-set fallbacks; derived payoffs replace them.
        sides:
          A: {discount: 0.95, breakdown_value: -4.0, impasse_value: 1.2, commitment: 0.75, commitment_cost: 0.8}
          B: {discount: 0.9, breakdown_value: -4.0, impasse_value: 0.2}
        breakdown: {base: 0.02, growth: 0.01, max: 0.1}
        consent:
          - {role: UK, base: -0.2, per_share: 1.0, veto_value: 0.0}
          - {role: FRA, base: -0.3, per_share: 1.0, veto_value: 0.0}
        # PLACEHOLDERS, swept in E21: priors 0.5 (maximal uncertainty, not fitted); per-quarter
        # costs spread around the old common values (US 0.08, USSR 0.10).
        types:
          A: {prior: {strong: 0.5, weak: 0.5}, delay_cost: {strong: 0.04, weak: 0.16}}
          B: {prior: {strong: 0.5, weak: 0.5}, delay_cost: {strong: 0.05, weak: 0.20}}
        # PLACEHOLDER, swept: the West's position gains a quarter with probability 0.6. Anchor
        # (Miller 2000): about 2,000-2,500 t/day in July 1948 against about 4,500 needed; about
        # the need by autumn; a winter dip; about 8,000 by spring 1949. Four net gains (or losses)
        # from the middle end the standoff: the blockade (or the city) gives out.
        contest: {initial: 0.5, step: 0.125, win_probability: 0.6}
      # Standing scoreboard: the airlift outlasting the blockade is a Western win.
      results: {impasse: {USA: 1.0, USSR: 0.0}}
      historical:
        # The US commits ("we stay"). Its terms: lift the blockade first (July 1948 notes); the
        # 30 August Moscow directive (Soviet mark in Berlin under four-power control); the UN
        # neutral states' currency plan (late 1948); the Jessup-Malik terms (lift both blockades,
        # then a Council of Foreign Ministers), accepted in May 1949. The types are a reading of
        # the record (both sides held on for eleven months), not a measurement.
        choices: {USA: [commit, offer_100, offer_075, offer_075, offer_100, offer_100], USSR: [reject, reject, reject, reject, accept], UK: [ratify], FRA: [ratify]}
        chance: [strong, strong, talks_continue, a_gains, talks_continue, b_gains, talks_continue, a_gains, talks_continue, a_gains]
        outcome: agreement
    outcomes:
      agreement:
        narrative: The blockade is lifted on terms that settle Berlin's status.
        # The Western gain is shared by the three western occupiers in proportion to their
        # influence in Germany in 1948 (0.286 : 0.142 : 0.095), not handed to the US alone.
        effects:
          - shift_influence: {region: germany, toward: USA, amount: 0.14, scale_by: share}
          - shift_influence: {region: germany, toward: UK, amount: 0.07, scale_by: share}
          - shift_influence: {region: germany, toward: FRA, amount: 0.05, scale_by: share}
          - shift_influence: {region: germany, toward: USSR, amount: 0.25, scale_by: {metric: share, invert: true}}
          - add: {path: powers.USA.credibility, value: 0.1, scale_by: share}
          - flag: berlin_settled
          - tension: -0.05
      breakdown:
        narrative: An armed convoy meets Soviet forces; shots are fired around Berlin.
        effects: [{tension: 0.4}, {relations: {a: USA, b: USSR, add: -0.4}}, {add: {path: powers.USA.conventional, value: -0.5}}, {add: {path: powers.USSR.conventional, value: -0.5}}, {add: {path: regions.germany.stability, value: -0.3}}, {flag: berlin_clash}]
      impasse:
        narrative: The airlift outlasts the blockade; West Berlin holds.
        effects:
          - shift_influence: {region: germany, toward: USA, amount: 0.05}
          - shift_influence: {region: germany, toward: UK, amount: 0.03}
          - shift_influence: {region: germany, toward: FRA, amount: 0.02}
          - flag: [berlin_settled, berlin_airlift_success]
      vetoed:
        narrative: The allies reject the proposed settlement; the airlift goes on.
        effects: [{flag: berlin_settled}]
    tags:
      # the veto's cost falls on whoever vetoed
      "UK:vetoed": {effects: [{relations: {a: USA, b: UK, add: -0.1}}]}
      "FRA:vetoed": {effects: [{relations: {a: USA, b: FRA, add: -0.1}}]}
      "USA:broke_commitment": {effects: [{add: {path: powers.USA.credibility, value: -0.15}}]}
