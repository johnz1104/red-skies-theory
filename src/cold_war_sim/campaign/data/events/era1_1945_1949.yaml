          USA: {side: a, capacity: 0.5, values: {a_victory: 1.0, b_victory: -1.0, partition: -0.2, a_withdrew: -0.8, b_withdrew: 1.0, stalemate: 0.0}}
          PRC: {side: b, capacity: 0.6, values: {a_victory: -1.0, b_victory: 1.5, partition: 0.5, a_withdrew: 1.5, b_withdrew: -1.0, stalemate: 0.0}}
          USSR: {side: b, capacity: 0.3, values: {a_victory: -0.5, b_victory: 1.0, partition: 0.4, a_withdrew: 1.0, b_withdrew: -0.5, stalemate: 0.0}}
