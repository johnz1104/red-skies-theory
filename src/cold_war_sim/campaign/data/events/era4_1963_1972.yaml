    narrative: "Washington and Moscow open a hotline and sign the Limited Test Ban Treaty."
    effects: [{flag: limited_test_ban}, {tension: -0.1}, {relations: {a: USA, b: USSR, add: 0.15}}]

  - id: prc_atomic_bomb
