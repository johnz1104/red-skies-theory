        - compare: {path: powers.FRA.relations.USA, op: lt, value: 0.4}
    narrative: "De Gaulle withdraws France from NATO's integrated military command."
    effects: [{flag: france_out_of_nato_command}, {relations: {a: FRA, b: USA, add: -0.1}}, {add: {path: powers.FRA.prestige, value: 0.05}}]

  - id: cultural_revolution
