    historical_date: 1969-Q3
    excludes: [soviet_moon_landing]
    when: {compare: {path: powers.USA.tech_space, op: ge, value: 3.5}}
    narrative: "Apollo 11 lands on the Moon."
    effects: [{flag: moon_landing}, {add: {path: powers.USA.prestige, value: 0.15}}]

  - id: soviet_moon_landing
    kind: cutscene
    title: A Soviet cosmonaut on the Moon
    race: {winner: USSR, loser: USA}
    window: {earliest: 1960-Q1}
    when: {compare: {path: powers.USSR.tech_space, op: ge, value: 3.5}}
    narrative: "A Soviet cosmonaut is the first human on the Moon."
    effects: [{flag: soviet_moon_landing}, {add: {path: powers.USSR.prestige, value: 0.15}}, {add: {path: powers.USA.prestige, value: -0.05}}]

  - id: ostpolitik
