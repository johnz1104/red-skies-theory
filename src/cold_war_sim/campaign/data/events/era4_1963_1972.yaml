# Era IV, 1963-1972: Vietnam, the Sino-Soviet confrontation and the triangle. Illustrative.
era: 4
title: Vietnam and the triangle (1963-1972)
events:
  # ----------------------------------------------------------- leadership
  - id: johnson_succeeds
    kind: leadership
    title: Kennedy assassinated
    window: {earliest: 1963-Q4, latest: 1964-Q4}
    historical_date: 1963-Q4
    priority: 20
    when: {leader: {power: USA, in: [kennedy]}}
    narrative: "President Kennedy is assassinated in Dallas; Lyndon Johnson takes office."
    effects: [{leader: johnson}, {add: {path: powers.USA.stability, value: -0.03}}]

  - id: douglas_home_succeeds
    kind: leadership
    title: Douglas-Home succeeds Macmillan
    window: {earliest: 1963-Q4, latest: 1964-Q3}
    historical_date: 1963-Q4
    priority: 20
    when: {leader: {power: UK, in: [macmillan]}}
    narrative: "Macmillan resigns; Alec Douglas-Home becomes Prime Minister."
    effects: [{leader: douglas_home}]

  - id: khrushchev_ousted
    kind: leadership
    title: Khrushchev ousted
    window: {earliest: 1964-Q4, latest: 1966-Q4}
    historical_date: 1964-Q4
    priority: 20
    when: {leader: {power: USSR, in: [khrushchev]}}
    narrative: "The Presidium removes Khrushchev; Leonid Brezhnev becomes First Secretary."
    effects: [{leader: brezhnev}]

  - id: wilson_elected
    kind: leadership
    title: Wilson elected
    window: {earliest: 1964-Q4, latest: 1966-Q4}
    historical_date: 1964-Q4
    priority: 20
