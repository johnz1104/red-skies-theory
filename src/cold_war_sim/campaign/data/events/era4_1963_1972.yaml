  # ------------------------------------------------------------ cutscenes
  - id: kim_seeks_war_vietnam
    kind: cutscene
    title: Kim Il-sung looks south again
    window: {earliest: 1964-Q3, latest: 1972-Q4}
    when:
      all:
        - active: vietnam_war
        - any: [{flag: korean_armistice}, {flag: korean_frozen_conflict}]
        - no_flag: [korea_peace_treaty, us_troops_korea, korean_war, kim_asks]
    # With the US tied down in Vietnam, Pyongyang ran a guerrilla campaign along the DMZ
    # (1966-69), raided the Blue House and seized the Pueblo (January 1968). With no US troops
    # in the South, Kim asks his patrons for a second war (E31).
    narrative: "With America at war in Vietnam, Kim Il-sung asks Moscow and Beijing to back a second war in Korea."
    effects: [{flag: kim_asks}]

  - id: hotline_test_ban
    kind: cutscene
