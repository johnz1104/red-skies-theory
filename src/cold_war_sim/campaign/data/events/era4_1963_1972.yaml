    narrative: "Mao unleashes the Cultural Revolution; China turns inward in chaos."
    effects: [{flag: cultural_revolution}, {add: {path: powers.PRC.stability, value: -0.2}}, {add: {path: powers.PRC.growth, value: -0.01}}]

  - id: six_day_war
    kind: cutscene
