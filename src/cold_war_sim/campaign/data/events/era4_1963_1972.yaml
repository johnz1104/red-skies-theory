    when: {active_for: {event: vietnam_war, quarters: 14}}
    narrative: "The Tet Offensive shatters American confidence in the war."
    effects: [{flag: tet_offensive}, {add: {path: powers.USA.stability, value: -0.1}}, {add: {path: powers.USA.prestige, value: -0.05}}]

  - id: uk_east_of_suez
