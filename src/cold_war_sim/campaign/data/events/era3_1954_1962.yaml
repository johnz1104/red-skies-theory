  - id: suez_crisis
    kind: major
    title: The Suez Crisis
    window: {earliest: 1956-Q4, latest: 1957-Q4}
    historical_date: 1956-Q4
    when: {flag: suez_canal_nationalized}
    # Review of 2026-10-14 (EXPERIMENTS.md E41; Kyle, Suez, 1991; Kunz, The Economic Diplomacy
    # of the Suez Crisis, 1991; Nichols, Eisenhower 1956, 2011). Britain and France invaded with
    # Israel's pretext (Sevres); Eisenhower, not consulted, forced their withdrawal by money (a
    # run on sterling, the IMF drawing and emergency oil withheld). Bulganin's rocket threat of
    # 5 November was a bluff.
    model:
      family: crisis
      tier: 1
      payoffs: derived
      region: middle_east
      config:
        roles:
          UK: {side: a, values: {a_prevails: 1.5, b_prevails: -1.0, compromise: 0.2, limited_war: -2.0, nuclear_war: -40}, escalation_cost: 0.1}
          FRA: {side: a, values: {a_prevails: 1.5, b_prevails: -0.8, compromise: 0.2, limited_war: -2.0, nuclear_war: -40}, escalation_cost: 0.1}
          EGY: {side: b, values: {a_prevails: -2.0, b_prevails: 1.5, compromise: 0.0, limited_war: -2.0, nuclear_war: -40}}
          USSR: {side: b, values: {a_prevails: -0.8, b_prevails: 0.8, compromise: 0.0, limited_war: -3.0, nuclear_war: -40}, escalation_cost: 0.2}
          USA: {side: neutral, values: {a_prevails: -0.5, b_prevails: 0.4, compromise: 0.3, limited_war: -2.0, nuclear_war: -40}}
        script:
          # Hidden types with leaders' own beliefs (user decisions 2026-10-14, E41):
          # - Soviet stakes: would Moscow fight for Nasser at all? A committed USSR (the 1955
          #   arms deal, Khrushchev's courting of Nasser) counts an allied victory as a heavy
          #   loss, sized so it would intervene if Britain pressed on after paying the
          #   intervention's own cost; a bluffing one would not. In fact a bluff (Khrushchev
          #   later admitted it; no forces were readied), but London, Paris and Washington
          #   could not be sure: the US checked by U-2 for Soviet forces in Syria, and
          #   Eisenhower spoke of hitting back "with everything in the bucket". Beliefs and
          #   the offset are placeholders.
          # - US stakes: Eisenhower opposed force from the start (his September letters: US
          #   opinion "flatly rejects" it). Eden expected acquiescence: Macmillan, after seeing
          #   Eisenhower on 25 September, told him "I know Ike. He will lie doggo". An
          #   acquiescent US would put the alliance above the Arab world (offset placeholder).
          - stage: types
            roles:
              USSR:
                stakes: {committed: {weight: 0.1, offsets: {a_prevails: -7.5}}, bluffing: {weight: 0.9}}
                stakes_beliefs: {UK: {committed: 0.3, bluffing: 0.7}, FRA: {committed: 0.3, bluffing: 0.7}, USA: {committed: 0.3, bluffing: 0.7}}
              USA:
                stakes: {opposed: {weight: 1.0}, acquiescent: {weight: 0.0, offsets: {a_prevails: 1.0}}}
                stakes_beliefs: {UK: {opposed: 0.2, acquiescent: 0.8}, FRA: {opposed: 0.2, acquiescent: 0.8}}
          - {stage: move, actor: UK, options: [{id: refrain, kind: concede}, {id: invade, kind: escalate}]}
          - {stage: move, actor: FRA, options: [{id: stay_out, kind: hold}, {id: join_invasion, kind: escalate}]}
          - {stage: move, actor: EGY, options: [{id: accept_terms, kind: concede}, {id: resist, kind: hold}]}
          - {stage: move, actor: USSR, options: [{id: stay_out, kind: hold}, {id: threaten_intervention, kind: escalate}]}
          # Washington may also stand aside, as Eden expected it to
          - {stage: partner, actor: USA, options: [{id: back_allies, target: b, risk_multiplier: 0.8}, {id: financial_pressure, target: a, continue_cost: 1.5}, {id: stand_aside, target: a}]}
          - {stage: move, actor: UK, options: [{id: withdraw, kind: concede}, {id: press_on, kind: hold}]}
          # The threat's follow-through: if Britain presses on, Moscow intervenes or not
          - {stage: move, actor: USSR, options: [{id: stand_aside, kind: hold}, {id: intervene, kind: fight}]}
          # A regional war, never a nuclear one: no nuclear forces were readied, and the
          # threat was a bluff. Under derived payoffs a nuclear war is worth -2000, so even
          # the old 1% share outweighed every stake (user decision 2026-10-14, E41)
          - {stage: accident, base: 0.01, per_rung: 0.02}
        final_outcome: a_prevails
      bindings:
        # The pressure bit through Britain's weakness (Kunz): reserves fell about $279 million
        # in November 1956, and the US held back an IMF drawing until Britain withdrew. Its
        # cost rises as Britain's economy weakens: 1.5 at the 1956 level (user decision
        # 2026-10-14, E41)
        - {at: script.5.options.1.continue_cost, base: 4.65, terms: {powers.UK.economy: -10.0}, clamp: [0.5, 4.0]}
      historical:
        choices: {UK: [invade, withdraw], FRA: [join_invasion], EGY: [resist], USSR: [threaten_intervention], USA: [financial_pressure]}
        chance: [bluffing, calm]
        outcome: b_prevails
    # Effects completed from the record (user decision 2026-10-14, E41; sizes are placeholders).
    # Prestige effects were removed (prestige left the goals on 2026-10-10)
    outcomes:
      a_prevails:
        narrative: "British and French forces retake the canal; the Arab world turns against the West."
        effects:
          - {shift_influence: {region: middle_east, toward: UK, amount: 0.15}}
          - {shift_influence: {region: middle_east, toward: FRA, amount: 0.05}}
          # Nasser's aid to Algeria's FLN cut off (Mollet's aim)
          - {shift_influence: {region: north_africa, toward: FRA, amount: 0.05}}
          # Eisenhower: "How could we possibly support Britain and France if in doing so we
          # lose the whole Arab world?" The Arab world turns to Moscow
          - {shift_influence: {region: middle_east, toward: USA, amount: -0.1}}
          - {shift_influence: {region: middle_east, toward: USSR, amount: 0.05}}
          # Syria cut the IPC pipeline; Saudi Arabia embargoed Britain and France
          - {add: {path: regions.middle_east.stability, value: -0.15}}
          # aggression unpunished: the US had pledged in the 1950 Tripartite Declaration to act
          # against force across the armistice lines ("one law", Eisenhower, 31 October)
          - {add: {path: powers.USA.credibility, value: -0.05}}
      b_prevails:
        narrative: "Under American financial pressure and Soviet threats, Britain and France withdraw."
        effects:
          - {flag: suez_humiliation}
          - {shift_influence: {region: middle_east, toward: UK, amount: -0.2}}
          - {shift_influence: {region: middle_east, toward: FRA, amount: -0.05}}
          # Soviet arms and standing ("Moscow saved Egypt"); the US replaces Britain as the
          # leading Western power in the region (the Eisenhower Doctrine, January 1957)
          - {shift_influence: {region: middle_east, toward: USSR, amount: 0.1}}
          - {shift_influence: {region: middle_east, toward: USA, amount: 0.05}}
          # Nasser's standing lifts the FLN
          - {shift_influence: {region: north_africa, toward: FRA, amount: -0.05}}
          # the US upheld the UN principle and its 1950 Tripartite pledge
          - {add: {path: powers.USA.credibility, value: 0.05}}
      compromise: {narrative: "The canal crisis is settled through the United Nations.", effects: [{add: {path: regions.middle_east.stability, value: 0.05}}]}
      limited_war:
        narrative: "The Suez war widens into a regional conflict."
        effects:
          - {tension: 0.25}
          - {add: {path: regions.middle_east.stability, value: -0.3}}
          - {add: {path: powers.UK.stability, value: -0.05}}
          - {add: {path: powers.FRA.stability, value: -0.05}}
          # a war in which Moscow might join is a superpower confrontation, which Eisenhower
          # wanted ended fast
          - {relations: {a: USA, b: USSR, add: -0.2}}
      nuclear_war: {effects: [{end_campaign: nuclear_war}]}
    # Consequences of actions, whatever the outcome; derived payoffs count them as the
    # action's costs (user decision 2026-10-14, E41)
    tags:
      "USSR:move=threaten_intervention": {effects: [{shift_influence: {region: middle_east, toward: USSR, amount: 0.05}}]}
      # The rift came with Washington's opposition: an acquiescent US that stood aside would
      # cause none, as Eden expected. It was short-lived with Britain (restored at Bermuda,
      # March 1957) and longer with France (de Gaulle)
      "USA:partner=financial_pressure":
        effects:
          - {relations: {a: USA, b: UK, add: -0.05}}
          - {relations: {a: USA, b: FRA, add: -0.1}}
      # Moscow's intervention against Britain and France: its own cost
      "USSR:move=intervene":
        effects:
          - {add: {path: powers.USSR.stability, value: -0.05}}
          - {relations: {a: USSR, b: UK, add: -0.3}}
          - {relations: {a: USSR, b: FRA, add: -0.3}}
          - {relations: {a: USSR, b: USA, add: -0.3}}

