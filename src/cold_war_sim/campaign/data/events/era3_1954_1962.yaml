  # ------------------------------------------------------- Korea after the war
  # (user decisions 2026-10-12; EXPERIMENTS.md E31)
  - id: us_korea_troops
    kind: decision
    title: American troops in Korea after the armistice
    window: {earliest: 1950-Q3, latest: 1991-Q4}
    once: false  # yearly, so no historical date (the replay checks an event's last firing)
    when:
      all:
        - flag: us_troops_korea
        - any: [{flag: korean_armistice}, {flag: korean_frozen_conflict}]
        - no_flag: korea_peace_treaty
        - quarter_of_year: 1
    # The Mutual Defense Treaty (signed October 1953) kept US forces in the South as a
    # tripwire. Nixon withdrew the 7th Division (about 20,000 men) in 1971; Carter planned to
    # withdraw the ground forces in 1977 and dropped the plan in 1979. Leaving frees forces, as
    # in 1949, but breaks faith with a treaty ally (credibility, placeholder) and reopens the
    # risk of a renewed war when the US is distracted elsewhere.
    decision: {power: USA, tier: 2, historical: [keep_garrison]}
    outcomes:
      keep_garrison:
        narrative: "American troops stay in South Korea under the defence treaty."
      withdraw:
        narrative: "The United States withdraws its troops from South Korea."
        effects: [{unflag: us_troops_korea}, {flag: us_left_korea}, {add: {path: powers.USA.conventional, value: 0.1}}, {add: {path: powers.USA.credibility, value: -0.05}}]

  # The armistice (Article IV) called for a political conference within three months. It met
  # at Geneva from 26 April to 15 June 1954 and failed. The issue was indivisible: Washington
  # and Seoul wanted UN-supervised elections across Korea, where the South held about two
  # thirds of the people; the Communists wanted foreign troops out first and neutral
  # supervision. An agreement here is all-Korea elections: the share is the agreed chance
  # that Seoul wins them (the supervision terms), and the result is a lottery between
  # unification under Seoul and under Kim, with foreign troops leaving. With a Communist China
  # in the war, Beijing loses its buffer if Seoul wins, so no terms suit both sides and the
  # armistice stays without a treaty, the canonical outcome. Without one, Moscow negotiates
  # (geneva_korea_soviet) and might accept even odds, as it accepted Austria's neutrality.
  # In both, the two Korean governments must ratify, and neither accepts an election it might
  # lose (E39), so election unification is effectively closed in this window.
  # Losing Korea at the polls costs Washington credibility, less than a lost war (-0.1
  # against -0.15; placeholder): the US backed the cancellation of Vietnam's 1956 elections
  # because Ho Chi Minh would have won them. Winning gains as much.
  - id: geneva_korea
    kind: major
    title: The Geneva Conference on Korea
    window: {earliest: 1950-Q3, latest: 1958-Q4}
    historical_date: 1954-Q2
    excludes: [geneva_korea_soviet]
    when:
      all:
        - flag: korean_armistice
        - no_flag: korea_peace_treaty
        - quarter_of_year: 2
        - status: {power: PRC, in: [active]}
        - regime: {power: PRC, in: [ccp]}
    model:
      family: bargaining
      tier: 2
      payoffs: derived
      cadence: quarterly
      region: korea
      config:
        roles: {A: USA, B: PRC}
        grid: [0.4, 0.5, 0.6, 0.67]  # the chance that Seoul wins all-Korea elections
        horizon: 1  # one session: the Korean phase ran 26 April to 15 June 1954 (E33)
        first_proposer: A
        # outcome values are hand-set fallbacks; derived payoffs replace them
        sides:
          A: {discount: 0.95, breakdown_value: 0.0, impasse_value: 0.0}
          B: {discount: 0.95, breakdown_value: 0.0, impasse_value: 0.0}
        breakdown: {base: 0.05, growth: 0.0, max: 0.05}
        consent:
          - {role: USSR}
          - {role: UK}
          # the two Korean governments ratify too (user decision 2026-10-13, E39): each
          # faced its end if it lost, and would accept only elections it was sure to win.
          # Rhee refused to sign the armistice and freed about 27,000 prisoners to wreck it
          # (18 June 1953); Seoul's 14 points (22 May 1954) asked UN-supervised elections by
          # population; Nam Il's plan (27 April 1954) gave the North an equal-seat commission.
          # Hand values mirror Kim's in the war (unification +3, the regime's end -5), over
          # the chance that Seoul wins: Seoul ratifies at 0.625 or more, Pyongyang at 0.375
          # or less, so no terms pass both and the armistice stays
          - &rok_consent {role: ROK, base: -5.0, per_share: 8.0, veto_value: 0.0}
          - &dprk_consent {role: DPRK, base: 3.0, per_share: -8.0, veto_value: 0.0}
      historical:
        # the US proposed UN-supervised elections by population; Zhou Enlai and Molotov
        # proposed an all-Korean commission and neutral supervision; no agreement. One round:
        # the US offers its terms and the Communist side rejects them
        choices: {USA: [offer_067], PRC: [reject]}
        outcome: impasse
    outcomes:
      agreement: &korea_elections {narrative: "Korea is unified by elections under international supervision; foreign troops leave.", effects: [{flag: korea_peace_treaty}, {unflag: [korea_divided, korean_armistice, korean_frozen_conflict, us_troops_korea]}, {tension: -0.1}, {lottery: {chance: {metric: share}, win: [{set_controller: {region: korea, to: USA}}, {flag: korea_unified_west}, {add: {path: powers.USA.credibility, value: 0.1}}], lose: [{set_controller: {region: korea, to: USSR}}, {flag: korea_unified_communist}, {add: {path: powers.USA.credibility, value: -0.1}}]}}]}
      breakdown: &korea_breakdown {narrative: "The conference on Korea breaks up in recriminations.", effects: [{tension: 0.05}]}
      impasse: &korea_impasse {narrative: "The conference on Korea ends without agreement; the armistice remains, with no peace treaty."}
      vetoed: &korea_vetoed {narrative: "A patron or one of the Korean governments refuses the terms; the armistice remains, with no peace treaty."}

  - id: geneva_korea_soviet
    kind: major
    title: The Geneva Conference on Korea (without Communist China)
    window: {earliest: 1950-Q3, latest: 1958-Q4}
    excludes: [geneva_korea]
    when:
      all:
        - flag: korean_armistice
        - no_flag: korea_peace_treaty
        - quarter_of_year: 2
        - not: {all: [{status: {power: PRC, in: [active]}}, {regime: {power: PRC, in: [ccp]}}]}
    model:
      family: bargaining
      tier: 2
      payoffs: derived
      cadence: quarterly
      region: korea
      config:
        roles: {A: USA, B: USSR}
        grid: [0.4, 0.5, 0.6, 0.67]
        horizon: 1  # one session: the Korean phase ran 26 April to 15 June 1954 (E33)
        first_proposer: A
        sides:
          A: {discount: 0.95, breakdown_value: 0.0, impasse_value: 0.0}
          B: {discount: 0.95, breakdown_value: 0.0, impasse_value: 0.0}
        breakdown: {base: 0.05, growth: 0.0, max: 0.05}
        consent:
          - {role: UK}
          - *rok_consent
          - *dprk_consent
      historical:
        # a counterfactual (China was Communist): the plan is for on-rails play, with no outcome
        choices: {USA: [offer_067], USSR: [reject]}
    outcomes:
      agreement: *korea_elections
      breakdown: *korea_breakdown
      impasse: *korea_impasse
      vetoed: *korea_vetoed

