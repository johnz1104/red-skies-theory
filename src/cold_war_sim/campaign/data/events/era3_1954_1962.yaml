  # -------------------------------------------------------- major events
  - id: geneva_conference
    kind: major
    title: The Geneva Conference on Indochina
    window: {earliest: 1953-Q2, latest: 1956-Q4}
    historical_date: 1954-Q2
    when: {all: [{flag: indochina_partitioned}, {regime: {power: PRC, in: [ccp]}}]}
    model:
      family: bargaining
      tier: 2
      cadence: quarterly
      region: indochina
      config:
        roles: {A: FRA, B: PRC}
        grid: [0.3, 0.4, 0.5, 0.6, 0.7]
        horizon: 3
        first_proposer: B
        surplus: 2.0
        sides:
          A: {discount: 0.9, delay_cost: 0.1, breakdown_value: -2.0, impasse_value: -1.0}
          B: {discount: 0.95, delay_cost: 0.05, breakdown_value: -1.0, impasse_value: -0.5}
        breakdown: {base: 0.05, growth: 0.05, max: 0.2}
        consent:
          - {role: USA, base: -0.3, per_share: 0.8, veto_value: 0.0}
          - {role: USSR, base: 0.4, per_share: -0.2, veto_value: 0.0}
          - {role: UK, base: 0.2, per_share: 0.0, veto_value: 0.0}
      historical:
        choices: {PRC: [offer_040, accept], FRA: [reject, offer_050], USA: [ratify], USSR: [ratify], UK: [ratify]}
        chance: [talks_continue]
        outcome: agreement
    outcomes:
      agreement: {narrative: "Vietnam is partitioned at the 17th parallel; France withdraws from Indochina.", effects: [{flag: [vietnam_partitioned, french_exit_indochina]}, {shift_influence: {region: indochina, toward: FRA, amount: -0.4}}, {shift_influence: {region: indochina, toward: USA, amount: 0.25, scale_by: share}}, {shift_influence: {region: indochina, toward: PRC, amount: 0.25, scale_by: {metric: share, invert: true}}}]}
      breakdown: {narrative: "The conference collapses and the fighting resumes.", effects: [{flag: indochina_war_resumes}, {add: {path: regions.indochina.stability, value: -0.2}}]}
      impasse: {narrative: "No settlement is reached; Indochina remains contested.", effects: [{flag: [vietnam_partitioned, indochina_unsettled]}]}
      vetoed: {narrative: "Washington refuses to endorse the accords.", effects: [{flag: [vietnam_partitioned, indochina_unsettled]}, {relations: {a: USA, b: FRA, add: -0.1}}]}

  - id: taiwan_strait_1954
