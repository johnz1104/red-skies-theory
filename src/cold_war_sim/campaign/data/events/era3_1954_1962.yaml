        - {at: clients.CONGO.affinity.USA, base: 0.0, terms: {regions.central_africa.influence.USA: 1.0, regions.central_africa.influence.UK: 0.5}, clamp: [-1.0, 1.5]}
        - {at: clients.CONGO.affinity.USSR, base: 0.1, terms: {regions.central_africa.influence.USSR: 1.0}, clamp: [-1.0, 1.5]}
      historical:
        choices: {USA: [aid_guarantee], USSR: [aid]}
        chance: [aligned_USA]
        outcome: aligned_USA
    outcomes:
      aligned_USA: {narrative: "Mobutu takes power with Western backing; Lumumba is murdered.", effects: [{shift_influence: {region: central_africa, toward: USA, amount: 0.25}}]}
      aligned_USSR: {narrative: "Lumumba's government survives with Soviet help.", effects: [{shift_influence: {region: central_africa, toward: USSR, amount: 0.25}}]}
      nonaligned: {narrative: "The Congo fragments; no outside power prevails.", effects: [{add: {path: regions.central_africa.stability, value: -0.1}}]}

  - id: bay_of_pigs
