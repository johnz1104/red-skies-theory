  - id: cuban_missile_crisis
    kind: major
    title: The Cuban Missile Crisis
    window: {earliest: 1962-Q4, latest: 1964-Q4}
    historical_date: 1962-Q4
    hazard: 0.5
    when:
      all:
        - flag: cuba_aligned_soviet
        - no_flag: castro_ousted
        - compare: {path: powers.USSR.nuclear, op: lt, path_rhs: powers.USA.nuclear, scale: 0.8}
        - compare: {path: powers.USSR.tech_missile, op: ge, value: 1.0}
    narrative: "U-2 photographs reveal Soviet medium-range missiles in Cuba."
    # Light review (2026-10-26, EXPERIMENTS.md E47; Fursenko and Naftali, "One Hell of a
    # Gamble", 1997; Allison and Zelikow, Essence of Decision, 1999; May and Zelikow, The
    # Kennedy Tapes, 1997; Dobbs, One Minute to Midnight, 2008; Sagan, The Limits of
    # Safety, 1993). Mechanism: private information about resolve under the risk of
    # inadvertent war (Schelling's "threat that leaves something to chance"), resolved by
    # a secret side payment (the Jupiters in Turkey).
    # - Khrushchev expected a fait accompli Kennedy would accept, reading him as weak after
    #   the Bay of Pigs and Vienna: his own prior on US resolve, bound to US credibility.
    # - Washington did not know of the ~42,000 Soviet troops (the CIA estimated ~10,000) or
    #   the ~100 tactical nuclear warheads (revealed in 1992): its own prior that Soviet
    #   forces were not ready for nuclear use, bound to its intelligence (space) capacity.
    # - Khrushchev's motive was also the strategic balance: the missiles kept in Cuba add to
    #   Soviet strategic forces (b_prevails).
    # - If no one concedes, deals or fights, the missiles stay (final_outcome b_prevails):
    #   a compromise comes only from an actual deal.
    model:
      family: crisis
      tier: 1
      holdout: true
      payoffs: derived
      effects: contract
      region: caribbean
      config:
        roles:
          USA: {side: a, values: {a_prevails: 2.0, b_prevails: -2.0, compromise: 0.6, limited_war: -6.0, nuclear_war: -50}, escalation_cost: 0.15, audience_cost: 1.0}
          USSR: {side: b, values: {a_prevails: -2.0, b_prevails: 2.0, compromise: 0.8, limited_war: -6.0, nuclear_war: -50}, escalation_cost: 0.15, audience_cost: 1.5, high_resolve_war_factor: 0.5}
          # officers (E48): computer-run commands that decide at incidents; they dread war
          # and a hold costs them their belief that war has begun times their duty
          B59: {side: neutral, values: {a_prevails: 0.0, b_prevails: 0.0, compromise: 0.0, limited_war: -2.0, nuclear_war: -10.0}}
          SAM: {side: neutral, values: {a_prevails: 0.0, b_prevails: 0.0, compromise: 0.0, limited_war: -2.0, nuclear_war: -10.0}}
        script:
          - stage: types
            roles:
              USA: {p_high_resolve: 0.5, resolve_beliefs: {USSR: 0.25}}
              USSR: {p_high_resolve: 0.4, p_high_readiness: 0.5, readiness_beliefs: {USA: 0.15}}
          - {stage: intel, about: USSR, observers: [USA], accuracy: 0.75}
          # the ExComm weighed accepting the missiles (McNamara: "a missile is a missile")
          - {stage: move, actor: USA, options: [{id: quarantine, kind: escalate, rungs: 1}, {id: air_strike, kind: escalate, rungs: 2}, {id: accept_missiles, kind: concede}]}
          # conventional clashes at the quarantine line; nuclear risk comes from the officers
          - {stage: accident, per_rung: 0.015, readiness_multiplier: 1.5}
          # Moscow's delegation: SAM fire authority lay with Pliyev's command in Cuba;
          # Khrushchev centralized it only after the U-2 fell (Fursenko and Naftali 1997)
          - {stage: move, actor: USSR, options: [{id: keep_delegation, kind: hold}, {id: centralize, kind: hold, control: 0.8}]}
          - {stage: signal, actor: USSR, options: [{id: conciliatory, stance: soft}, {id: hardline, stance: hard}]}
          # Khrushchev's letters of 26 and 27 October as one signal (the second letter's
          # revision dropped in E48 to keep the tree solvable with the officers)
          # the SAM commanders who shot down Anderson's U-2 without Moscow's order (27
          # October); the ExComm had agreed to strike the SAM sites if a U-2 fell, and
          # Kennedy held off (May and Zelikow 1997). A strike on Cuba could turn nuclear
          # where Soviet tactical warheads were ready (98 FKR and Luna warheads, unknown to
          # Washington; McNamara at Havana, 1992)
          - stage: incident
            officer: SAM
            command: b
            per_rung: 0.5
            temperaments: {steady: {weight: 0.5, hold_cost: 0.5, fire_cost: 5.0}, jumpy: {weight: 0.5, hold_cost: 15.0}}
            fire: {leader: USA, launch: limited_war, wait: continue, hold_cost: 0.5, launch_nuclear: 0.2}
          - {stage: move, actor: USA, options: [{id: negotiate, kind: deal}, {id: maintain_pressure, kind: hold}, {id: escalate, kind: escalate}]}
          - {stage: respond, actor: USSR}
          - {stage: move, actor: USSR, options: [{id: withdraw_missiles, kind: concede}, {id: stand_firm, kind: hold}]}
          # if Moscow stands firm, the quarantine and its incidents go on: Arkhipov aboard
          # B-59 (27 October), one of four nuclear-armed Foxtrots forced to surface under
          # practice depth charges, out of contact with Moscow (so no control order reaches
          # it); the captain wanted to fire and Arkhipov refused (Savranskaya, J. Strategic
          # Studies 28, 2005; Dobbs 2008). A nuclear torpedo puts Kennedy to retaliate
          # (McNamara at Havana, 1992: retaliation "no doubt") or not. It is the risk of
          # continuing that Khrushchev's letter of 26 October calls "the knot of war"
          - stage: incident
            officer: B59
            command: neutral
            per_rung: 0.8
            cap: 0.95
            needs_readiness: true
            temperaments: {steady: {weight: 0.9, hold_cost: 0.5, fire_cost: 5.0}, jumpy: {weight: 0.1, hold_cost: 15.0}}
            fire: {leader: USA, launch: nuclear_war, wait: limited_war, hold_cost: 250.0}
          - {stage: accident, base: 0.005, per_rung: 0.02, readiness_multiplier: 1.5}
        final_outcome: b_prevails
      bindings:
        - {at: script.0.roles.USSR.p_high_resolve, base: 0.1, terms: {powers.USSR.risk_tolerance: 0.4}, clamp: [0.05, 0.95]}
        - {at: script.1.accuracy, base: 0.55, terms: {powers.USA.tech_space: 0.1}, clamp: [0.55, 0.95]}
        # Khrushchev's prior that Kennedy is resolved rises with US credibility: 0.25 at the
        # 1962 replay world (credibility 0.86)
        - {at: script.0.roles.USA.resolve_beliefs.USSR, base: -0.18, terms: {powers.USA.credibility: 0.5}, clamp: [0.05, 0.95]}
        # Washington's prior that Soviet forces are nuclear-ready rises with its intelligence
        # capacity toward nature's: 0.15 at the replay world (space technology 2.73)
        - {at: script.0.roles.USSR.readiness_beliefs.USA, base: -0.12, terms: {powers.USA.tech_space: 0.1}, clamp: [0.05, 0.5]}
      historical:
        choices: {USA: [quarantine, wait, negotiate], USSR: [keep_delegation, hardline, accept], B59: [restrain], SAM: [fire]}
        chance: [high, low, high, alarming, calm, "incident:jumpy"]
        outcome: compromise
    # effects: the shared effects contract (contract.yaml) plus these documented additions
    outcomes:
      a_prevails: {narrative: "Khrushchev withdraws the missiles without concessions.", additions: [{flag: [soviet_missiles_withdrawn, cuban_missile_crisis_resolved]}]}
      # about 60 missiles planned for Cuba (36 R-12, 24 R-14) against about 200 Soviet
      # intercontinental launchers (some 44 ICBMs, 155 bombers; Garthoff, Reflections on the
      # Cuban Missile Crisis, 1989): Soviet strategic forces up by about 30%
      b_prevails: {narrative: "The missiles stay in Cuba.", additions: [{flag: [soviet_missiles_in_cuba, cuban_missile_crisis_resolved]}, {multiply: {path: powers.USSR.nuclear, factor: 1.3}}]}
      compromise: {narrative: "The missiles leave Cuba in exchange for a no-invasion pledge and the quiet removal of Jupiters from Turkey.", additions: [{flag: [soviet_missiles_withdrawn, jupiters_withdrawn, cuban_missile_crisis_resolved]}]}
      limited_war: {narrative: "American strikes on Cuba trigger a conventional war in the Caribbean.", additions: [{flag: cuban_war}]}
      nuclear_war: {narrative: "The crisis ends in nuclear war."}
    tags:
      "USSR:backed_down_after_commitment": {effects: [{add: {path: powers.USSR.credibility, value: -0.1}}]}
      "USA:backed_down_after_commitment": {effects: [{add: {path: powers.USA.credibility, value: -0.1}}]}
