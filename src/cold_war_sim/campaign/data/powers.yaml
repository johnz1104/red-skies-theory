# Powers: opening (1945-Q3) values, technology rates, objectives and end bonuses.
# Provenance: illustrative. Economy is an index (USA 1945 = 1.0); force and
# technology stocks are model units. Technology thresholds: 1.0 = first
# capability (atomic bomb, first satellite), 2.0 = second (hydrogen bomb).

powers:
  USA:
    name: United States
    initial:
      status: active
      economy: 1.0
      growth: 0.032
      burden: 0.10
      conventional: 3.0
      nuclear: 0.2
      tech_nuclear: 1.2
      tech_missile: 0.3
      tech_space: 0.05
      stability: 0.8
      credibility: 0.7
      prestige: 0.85
      posture: balanced
      leader: truman
    tech_rates: {nuclear: 0.6, missile: 1.0, space: 0.48}  # 0.5 -> 0.48 (2026-10-13, E35): the smaller growth penalty of military postures put Apollo 11 in 1968-Q3
    military_efficiency: 1.0
    casualty_sensitivity: 1.0  # a democracy: support falls with casualties (Mueller 1973; Gartner and Segura 1998)
    score_weights: {security: 1.0, influence: 1.5, economy: 1.0, prestige: 0.8, stability: 0.6, credibility: 0.6}
    # end bonuses apply to reward="score" only; under the goal reward the dissolution's own
    # effects (Soviet influence collapses) carry its meaning (user decision 2026-10-12; E33)
    end_bonus: {ussr_dissolved: 3.0}
  USSR:
    name: Soviet Union
    initial:
      status: active
      economy: 0.35
      growth: 0.05
      burden: 0.20
      conventional: 4.0
      nuclear: 0.0
      tech_nuclear: 0.3
      tech_missile: 0.3
      tech_space: 0.05
      stability: 0.7
      credibility: 0.6
      prestige: 0.75
      posture: nuclear
      leader: stalin
    tech_rates: {nuclear: 1.0, missile: 1.2, space: 1.0}
    military_efficiency: 0.9
    casualty_sensitivity: 0.3  # an autocracy pays less (Weeks 2008), not nothing: the Afghan war under glasnost (Kalinovsky 2011)
    score_weights: {security: 1.2, influence: 1.3, economy: 0.8, prestige: 0.8, stability: 1.0, credibility: 0.6}
    end_bonus: {ussr_dissolved: -5.0}
  PRC:
    name: China (the Communist party, then the PRC; the Nationalists if the seat changes hands)
    initial:
      status: insurgent
      regime: ccp
      economy: 0.12
      growth: 0.02
      burden: 0.2
      conventional: 1.0
      nuclear: 0.0
      tech_nuclear: 0.0
      tech_missile: 0.0
      tech_space: 0.0
      stability: 0.5
      credibility: 0.4
      prestige: 0.3
      posture: conventional
      leader: mao
    tech_rates: {nuclear: 2.3, missile: 1.0, space: 0.6}  # 2.2 -> 2.3 (2026-10-10): insurgent war costs slowed the first bomb to 1965-Q2
    military_efficiency: 0.8
    casualty_sensitivity: 0.3  # an autocracy (Weeks 2008)
    score_weights: {security: 1.2, influence: 0.8, economy: 1.0, prestige: 0.8, stability: 1.0, credibility: 0.4}
    end_bonus: {ussr_dissolved: 0.5}
  UK:
    name: United Kingdom
    initial:
      status: active
      economy: 0.25
      growth: 0.022
      burden: 0.12
      conventional: 1.5
      nuclear: 0.0
      tech_nuclear: 0.4
      tech_missile: 0.1
      tech_space: 0.0
      stability: 0.75
      credibility: 0.6
      prestige: 0.6
      posture: economy
      leader: attlee
    tech_rates: {nuclear: 1.9, missile: 0.8, space: 0.3}
    military_efficiency: 1.0
    casualty_sensitivity: 1.0  # a democracy
    score_weights: {security: 0.8, influence: 1.0, economy: 1.2, prestige: 1.0, stability: 0.8, credibility: 0.5}
    end_bonus: {ussr_dissolved: 1.0}
  FRA:
    name: France
    initial:
      status: active
      economy: 0.15
      growth: 0.04
      burden: 0.08
      conventional: 0.8
      nuclear: 0.0
      tech_nuclear: 0.1
      tech_missile: 0.05
      tech_space: 0.0
      stability: 0.5
      credibility: 0.4
      prestige: 0.4
      posture: conventional
      leader: fourth_republic
    tech_rates: {nuclear: 2.8, missile: 1.0, space: 0.4}
    military_efficiency: 1.0
    casualty_sensitivity: 1.0  # a democracy: Algeria brought down the Fourth Republic (Horne 1977)
    score_weights: {security: 0.8, influence: 1.0, economy: 1.2, prestige: 1.2, stability: 0.8, credibility: 0.5}
    end_bonus: {ussr_dissolved: 1.0}

# Postures: the shares of the state budget (economy x burden) reinvested in the economy and
# spent on conventional forces, nuclear forces and science. Each row sums to 1. Moved from
# dynamics.py on 2026-10-17 with the same values. Provenance: illustrative.
postures:
  economy: {economy: 0.55, conventional: 0.2, nuclear: 0.1, science: 0.15}
  balanced: {economy: 0.35, conventional: 0.3, nuclear: 0.2, science: 0.15}
  conventional: {economy: 0.25, conventional: 0.5, nuclear: 0.1, science: 0.15}
  nuclear: {economy: 0.25, conventional: 0.2, nuclear: 0.4, science: 0.15}
  science: {economy: 0.3, conventional: 0.15, nuclear: 0.15, science: 0.4}

# Symmetric opening relations in [-1, 1].
relations:
  USA-USSR: 0.3
  USA-PRC: 0.0
  USA-UK: 0.8
  USA-FRA: 0.5
  USSR-PRC: 0.5
  USSR-UK: 0.2
  USSR-FRA: 0.2
  PRC-UK: -0.2
  PRC-FRA: -0.2
  UK-FRA: 0.5

# Quarterly dynamics coefficients (see campaign/dynamics.py for meanings).
dynamics:
  relations_step: 0.02
  war_stability_drain: 0.04

rewards:
  # Nuclear war: one fixed catastrophe for every power, in goal-score units (user decision
  # 2026-10-20, QUESTIONS Q27). 2 is four times the US's 1962 goal score (0.50); at kappa
  # 100 it is -200 in payoff units, so a 1% chance of nuclear war costs 2, the size of a
  # typical crisis stake (Cuba, E12: US prevails +1.86, USSR prevails -3.48). At 20 a 0.1%
  # chance outweighed every stake and brinkmanship could not exist. Also the RL campaign's
  # terminal penalty, and the score reward's.
  nuclear_war_penalty: 2.0
  # Losing a seat (elimination, or the Communists losing China) under the goal reward:
  # the goal score drops to zero, so the penalty is the score held, but at least
  # loss_floor (decided 2026-10-10; docs/GOALS.md section 7).
  loss_floor: 0.1
  elimination_penalty: 5.0  # reward="score" (pre-goals comparison) only
